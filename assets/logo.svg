<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="agy-clarity">
  <defs>
    <linearGradient id="badgeBg" x1="14" y1="14" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="52%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="topFacet" x1="34" y1="30" x2="94" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="midLayer" x1="30" y1="58" x2="98" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="baseLayer" x1="30" y1="74" x2="98" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <!-- Rounded badge centered with ~11% transparent margin -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#badgeBg)"/>
  <rect x="15" y="15" width="98" height="98" rx="23" fill="none" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Bottom precision-anchor layer -->
  <path d="M32 82L64 98L96 82" fill="none" stroke="url(#baseLayer)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle mechanism-translation layer -->
  <path d="M32 67L64 83L96 67" fill="none" stroke="url(#midLayer)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top clarity prism facet (inverted-pyramid headline) -->
  <polygon points="64,30 96,48 64,66 32,48" fill="url(#topFacet)"/>
  <!-- Internal prism refraction crease for depth -->
  <path d="M64 30V66" stroke="#1D4ED8" stroke-opacity="0.28" stroke-width="2.5"/>
  <path d="M47 48H81" stroke="#0284C7" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
  <!-- Clarity spark node -->
  <circle cx="64" cy="48" r="4.5" fill="#0F172A"/>
</svg>
